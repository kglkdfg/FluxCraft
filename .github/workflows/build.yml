name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore FluxCraft.sln
      - name: Build
        run: dotnet build FluxCraft.sln -c Release --no-restore
      - name: Test
        run: dotnet test FluxCraft.sln -c Release --no-build
